<section class="page-hero">
  <div class="container">
    {{krumen}}
    <span class="eyebrow">Projekte</span>
    <h1>Projekte aus der Praxis.</h1>
    <p class="lead">Ein Auszug aus meiner Arbeit. Jedes Projekt ist individuell entstanden, weitere Referenzen folgen laufend.</p>
    <div class="btn-row"><a class="btn" href="{{R}}leistungen">Alle Leistungen{{ico:pfeil}}</a></div>
  </div>
</section>

<section class="section section--tight" aria-label="Ausgewählte Projekte">
  <div class="container">
    {{projektliste}}
  </div>
</section>

<section class="section section--accent" aria-labelledby="naechstes-titel">
  <div class="container split">
    <h2 id="naechstes-titel" class="reveal">Dein Projekt als nächste Referenz?</h2>
    <div class="split-body reveal">
      <p>Lass uns gemeinsam etwas bauen, das sich sehen lassen kann.</p>
      <div class="btn-row"><button type="button" class="btn" data-quiz-open>Projekt starten{{ico:pfeil}}</button></div>
    </div>
  </div>
</section>
