# Dateien mit "." am Anfang (.htaccess) veröffentlicht GitHub Pages ohnehin nicht.
# Diese Dateien bleiben im Repo, gehören aber nicht auf die öffentliche Seite:
exclude:
  - REGELN.md
  - README.md
  - kontakt-senden.php
  - .htaccess
  - .gitignore
