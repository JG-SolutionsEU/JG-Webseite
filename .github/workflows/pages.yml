# Veröffentlicht die Website bei jedem Push auf main über GitHub Pages.
# Es werden nur die öffentlichen Dateien hochgeladen; _quellen/, REGELN.md, README.md,
# kontakt-senden.php und .htaccess bleiben im Repo, landen aber nicht auf der Seite.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Öffentliche Dateien zusammenstellen
        run: |
          mkdir _site
          cp -r *.html css js assets leistungen favicon.svg apple-touch-icon.png site.webmanifest robots.txt sitemap.xml _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
